# Currency API endpoints
currency_current:
    path: /api/currencies/current
    controller: App\Controller\CurrencyController::getCurrentRates
    methods: [GET]

currency_health:
    path: /api/currencies/health
    controller: App\Controller\CurrencyController::getHealthStatus
    methods: [GET]

# Legacy endpoints
setupcheck:
    path: /api/setup-check
    controller: App\Controller\DefaultController::setupCheck

# Default route for frontend (must be last)
index:
    path: /{wildcard}
    defaults: {
        _controller: App\Controller\DefaultController::index
    }
    requirements:
        wildcard: .*

