nbp_api:
  # Current rates (priority order) - absolute URLs for consistency
  tables_today_url: "https://api.nbp.pl/api/exchangerates/tables/A/today/?format=json"
  tables_url: "https://api.nbp.pl/api/exchangerates/tables/A/?format=json"  
  rates_url: "https://api.nbp.pl/api/exchangerates/rates/A/{currency}?format=json"
  
  # Historical data - absolute URLs for reliability
  historical_last_url: "https://api.nbp.pl/api/exchangerates/tables/A/last/{count}?format=json"
  historical_tables_url: "https://api.nbp.pl/api/exchangerates/tables/A/{startDate}/{endDate}?format=json"
  historical_rates_url: "https://api.nbp.pl/api/exchangerates/rates/A/{currency}/last/{count}?format=json"
  historical_rate_date_url: "https://api.nbp.pl/api/exchangerates/rates/A/{currency}/{date}?format=json"

# Cache configuration for performance optimization
cache:
  ttl:
    nbp_api: 3600      # 1 hour cache for NBP API responses
    currency_rates: 3600  # 1 hour cache for calculated currency rates  
    config: 7200       # 2 hours cache for YAML configuration
  pools:
    nbp_api: 'nbp_api.cache'
    currency: 'currency.cache'
    config: 'config.cache'
  fallback:
    max_days: 3        # Maximum days to look back for cached fallback data
    strategy: 'graceful'  # graceful degradation when cache miss

currencies:
  EUR: 
    name: "Euro"
    buy_margin: -0.15  # kurs kupna = kurs średni NBP - 0.15 PLN
    sell_margin: 0.11  # kurs sprzedaży = kurs średni NBP + 0.11 PLN
  USD: 
    name: "US Dollar"
    buy_margin: -0.15  # kurs kupna = kurs średni NBP - 0.15 PLN  
    sell_margin: 0.11  # kurs sprzedaży = kurs średni NBP + 0.11 PLN
  CZK: 
    name: "Czech Koruna"
    buy_margin: null   # kantor nie skupuje tej waluty
    sell_margin: 0.2   # tylko sprzedaż = kurs średni NBP + 0.2 PLN
  IDR: 
    name: "Indonesian Rupiah"
    buy_margin: null   # kantor nie skupuje tej waluty
    sell_margin: 0.2   # tylko sprzedaż = kurs średni NBP + 0.2 PLN  
  BRL: 
    name: "Brazilian Real"
    buy_margin: null   # kantor nie skupuje tej waluty
    sell_margin: 0.2   # tylko sprzedaż = kurs średni NBP + 0.2 PLN 