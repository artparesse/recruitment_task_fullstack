# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/App'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/App/Controller/'
        autowire: true
        tags: ['controller.service_arguments']

    # Currency Application Services
    App\Service\ConfigurationService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Date helper service for business day calculations
    App\Service\DateHelperService: ~

    # Currency Rate Service with date helper
    App\Service\CurrencyRateService:
        arguments:
            $currencyRepository: '@App\Repository\CurrencyRepositoryInterface'
            $config: '@App\Service\ConfigurationService'
            $dateHelper: '@App\Service\DateHelperService'

    # Repository pattern for NBP API
    App\Repository\CurrencyRepositoryInterface:
        alias: App\Repository\CachedNBPCurrencyRepository

    # NBP API HTTP Client - specific for currency data fetching
    app.http_client.nbp:
        class: GuzzleHttp\Client
        arguments:
            - verify: false
              timeout: 10
              base_uri: 'https://api.nbp.pl'
              headers:
                User-Agent: 'Currency-Exchange-App/1.0'
                Accept: 'application/json'

    # Base NBP Repository (without cache)
    App\Repository\NBPCurrencyRepository:
        arguments:
            $httpClient: '@app.http_client.nbp'

    # Cached NBP Repository with decorator pattern
    App\Repository\CachedNBPCurrencyRepository:
        arguments:
            $repository: '@App\Repository\NBPCurrencyRepository'
            $nbpApiCache: '@nbp_api.cache'

    # Cached Currency Rate Service with decorator pattern
    App\Service\CachedCurrencyRateService:
        arguments:
            $currencyRateService: '@App\Service\CurrencyRateService'
            $currencyCache: '@currency.cache'

    # Console Command for cache warmup
    App\Command\CurrencyWarmupCommand:
        arguments:
            $nbpApiCache: '@nbp_api.cache'
            $currencyCache: '@currency.cache'
        tags:
            - { name: 'console.command' }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
